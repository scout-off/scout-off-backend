openapi: 3.0.3
info:
  title: ScoutOff API
  description: >
    Backend API for ScoutOff — a decentralised football scouting platform built on the Stellar
    blockchain (Soroban smart contracts).
  version: 1.0.0
  contact:
    name: ScoutOff Engineering
servers:
  - url: /api
    description: Stable API (version-less alias)
  - url: /api/v1
    description: API v1
  - url: /api/v2
    description: API v2 (includes SSE stream endpoint)
tags:
  - name: auth
    description: Authentication (SEP-10 challenge / JWT exchange)
  - name: players
    description: Player profile management and discovery
  - name: scouts
    description: Scout subscriptions, contacts, trial offers, and tools
  - name: validators
    description: Milestone evidence submission and review
  - name: admin
    description: Platform administration (admin role required)
  - name: events
    description: Server-Sent Events streams and event feeds
  - name: docs
    description: This documentation surface (self-describing)
  - name: v2
    description: v2
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Long-lived scout API key (alternative to a Bearer JWT). Restricted keys may only perform
        operations covered by their granted scopes (#1019). Legacy keys without a scope list are
        unrestricted.
  parameters:
    playerId:
      name: playerId
      in: path
      required: true
      schema:
        type: string
      description: Player's unique identifier (cuid2)
    walletParam:
      name: wallet
      in: path
      required: true
      schema:
        type: string
        minLength: 56
        maxLength: 56
      description: Stellar public key (G…)
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          enum:
            - true
    ErrorEnvelope:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: string
        code:
          type: string
    PlayerSummary:
      type: object
      required:
        - player_id
        - wallet
      properties:
        player_id:
          type: string
        wallet:
          type: string
        position:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        metadataUri:
          type: string
          nullable: true
        progress_level:
          type: integer
          minimum: 0
          maximum: 3
        created_at:
          type: integer
          description: Unix timestamp (seconds)
        registered_at:
          type: integer
          nullable: true
          description: Unix timestamp (seconds) of the on-chain registration, when known
        progress_tier_name:
          type: string
          enum:
            - Unverified
            - Verified Identity
            - Performance Milestones
            - Elite Tier
        tierName:
          type: string
        tierDescription:
          type: string
        is_active:
          type: integer
          enum:
            - 0
            - 1
        progressLabel:
          type: string
          description: UI label for the player's progress tier
        verificationBadge:
          type: string
          description: Verification badge key for the player's progress tier
    PlayerDetail:
      allOf:
        - $ref: '#/components/schemas/PlayerSummary'
        - type: object
          required:
            - offerCount
          properties:
            offerCount:
              type: integer
              minimum: 0
              description: Number of trial offers submitted for this player
    PlayerList:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required:
            - data
            - total
            - page
            - pageSize
            - pages
            - nextCursor
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/PlayerSummary'
            total:
              type: integer
            page:
              type: integer
            pageSize:
              type: integer
            pages:
              type: integer
            nextCursor:
              type: string
              nullable: true
              description: Opaque cursor for the next page of results, null on the last page
    SubscriptionStatus:
      type: object
      required:
        - active
      properties:
        active:
          type: boolean
        tier:
          type: string
          nullable: true
        expiresAt:
          type: integer
          nullable: true
        remainingDays:
          type: integer
          nullable: true
        gracePeriodActive:
          type: boolean
    TrialOffer:
      type: object
      required:
        - offer_id
        - scout_wallet
        - player_id
        - details_uri
        - status
        - created_at
      properties:
        offer_id:
          type: string
        scout_wallet:
          type: string
        player_id:
          type: string
        details_uri:
          type: string
        status:
          type: string
          enum:
            - pending
            - accepted
            - rejected
        reject_reason:
          type: string
          nullable: true
        responded_at:
          type: integer
          nullable: true
        created_at:
          type: integer
    Milestone:
      type: object
      properties:
        milestone_id:
          type: string
        player_id:
          type: string
        milestone_type:
          type: string
        evidence_uri:
          type: string
        submitted_at:
          type: integer
        approved_at:
          type: integer
          nullable: true
        status:
          type: string
          enum:
            - pending
            - approved
          description: Approval state added by the milestones endpoint ("all" status param)
  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Insufficient role or wallet mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
paths:
  /admin/actions/pending:
    get:
      tags:
        - admin
      summary: Returns all pending (non-expired, non-executed) multi-admin action proposals.
      operationId: getPendingActions
      description: |-
        Returns all pending (non-expired, non-executed) multi-admin action proposals.
        Results may be stale if an action expired between the listing and the next
        sweep, but approval of an expired action is rejected at the service layer.
      responses:
        '200':
          description: '{ success: true, data: PendingAction[] }'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/actions/{id}:
    get:
      tags:
        - admin
      summary: Returns details of a specific action proposal including collected signers.
      operationId: getPendingActionById
      description: Returns details of a specific action proposal including collected signers.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Action proposal ID
      responses:
        '200':
          description: '{ success: true, data: PendingActionDetail }'
        '404':
          description: '{ success: false, error: string } - Action not found'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/actions/{id}/approve:
    post:
      tags:
        - admin
      summary: Co-signs (approves) an existing pending action.
      operationId: approvePendingAction
      description: |-
        Co-signs (approves) an existing pending action. Requires the caller to be
        a distinct admin wallet that has not already signed. When the threshold of
        distinct signatures is met, the action is executed automatically.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Action proposal ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '200':
          description: '{ success: true, message, data } - Threshold met, action executed'
        '202':
          description: '{ success: true, message, data } - Signature recorded, more needed'
        '403':
          description: '{ success: false, error } - Not an admin wallet'
        '404':
          description: '{ success: false, error } - Action not found'
        '409':
          description: '{ success: false, error } - Duplicate signer'
        '410':
          description: '{ success: false, error } - Action expired'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/audit:
    get:
      tags:
        - admin
      summary: Returns paginated audit log entries.
      operationId: getAuditLog
      description: |-
        Returns paginated audit log entries. Supports `startDate`, `endDate` (ISO 8601),
        `action` filters, and `limit`/`offset` pagination.
      responses:
        '200':
          description: '{ success: true, data: AuditLogRow[], total, limit, offset }'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/audit/trail:
    get:
      tags:
        - admin
      summary: Returns a paginated, event-type-filtered audit trail.
      operationId: getAuditTrail
      description: |-
        Returns a paginated, event-type-filtered audit trail in the canonical
        AuditEntry shape { id, event_type, actor_wallet, target_id, metadata,
        created_at, hash }. Accepts ?eventType=, ?from=, ?to= (ISO 8601),
        ?page=, ?pageSize= (#832).
      responses:
        '200':
          description: '{ success: true, data: AuditEntry[], total, page, pageSize }'
        '400':
          description: '{ success: false, error: string } - Invalid eventType or date range'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/audit/verify:
    get:
      tags:
        - admin
      summary: Walks the audit_log hash chain and reports whether it is intact (#464).
      operationId: getAuditChainVerification
      description: Walks the audit_log hash chain and reports whether it is intact (#464).
      responses:
        '200':
          description: '{ success: true, data: { valid, brokenAtId, reason?, rowsChecked } }'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/contract/pause:
    post:
      tags:
        - admin
      summary: Stub endpoint that simulates pausing the Soroban smart contract.
      operationId: pauseContract
      description: |-
        Stub endpoint that simulates pausing the Soroban smart contract.
        Contract-level behavior is simulated — no real on-chain transaction is issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '202':
          description: '{ success: true, message: string, transactionId: string }'
        '401':
          description: '{ success: false, error: string } - Missing token'
        '403':
          description: '{ success: false, error: string } - Non-admin role'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/contract/unpause:
    post:
      tags:
        - admin
      summary: Stub endpoint that simulates unpausing the Soroban smart contract.
      operationId: unpauseContract
      description: |-
        Stub endpoint that simulates unpausing the Soroban smart contract.
        Contract-level behavior is simulated — no real on-chain transaction is issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '202':
          description: '{ success: true, message: string, transactionId: string }'
        '401':
          description: '{ success: false, error: string } - Missing token'
        '403':
          description: '{ success: false, error: string } - Non-admin role'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/events:
    get:
      tags:
        - admin
      summary: Returns all indexed Soroban contract events in insertion order.
      operationId: getAllEvents
      description: |-
        Returns all indexed Soroban contract events in insertion order.
        Query params: startDate, endDate (ISO 8601), eventType, fromLedger, toLedger, page, pageSize
      responses:
        '200':
          description: '{ success: true, data: AdminEvent[] }'
        '400':
          description: '{ success: false, error: string } - Invalid date range'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/events/export:
    get:
      tags:
        - admin
      summary: Streams indexed Soroban contract events as CSV.
      operationId: exportEvents
      description: >-
        Streams indexed Soroban contract events as CSV. Rows are fetched from the

        database in bounded pages and written to the response as they arrive, so

        memory usage stays constant regardless of table size.

        Useful for data analysis, reporting, and external system integration.


        Query params (same semantics as GET /api/admin/events): startDate, endDate (ISO 8601),
        eventType


        Timeout: 120 s (overrides the 30 s default — large exports can take up to 60 s).
      responses:
        '200':
          description: 'CSV file with columns: event_type, ledger, timestamp, payload'
        '400':
          description: '{ success: false, error: string } - Invalid date range'
        '401':
          description: '{ success: false, error: string } - Missing token'
        '403':
          description: '{ success: false, error: string } - Non-admin role'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/events/replay:
    post:
      tags:
        - admin
      summary: >-
        Trigger a targeted event replay for a small ledger range without modifying the main indexer
        cursor.
      operationId: triggerReplay
      description: |-
        Trigger a targeted event replay for a small ledger range without modifying
        the main indexer cursor. This is a surgical tool for fixing narrow historical
        gaps (e.g., "we think ledgers 500123-500130 were missed") while the indexer
        is live near tip.

        Maximum range is 200 ledgers. Events are upserted using INSERT OR IGNORE,
        so duplicates are silently skipped. Returns a count of newly inserted events.
      requestBody:
        required: true
        description: '{ fromLedger: number, toLedger: number }'
        content:
          application/json:
            schema:
              type: object
              properties:
                fromLedger:
                  type: integer
                  minimum: 0
                toLedger:
                  type: integer
                  minimum: 1
              required:
                - fromLedger
                - toLedger
              additionalProperties: false
      responses:
        '200':
          description: '{ success: true, data: { fromLedger, toLedger, eventsInserted } }'
        '409':
          description: '{ success: false, error: string } - job already running'
        '422':
          description: '{ success: false, error: string } - range ≥ 200 or invalid range'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/events/replay/status:
    get:
      tags:
        - admin
      summary: Return the current state of the replay job.
      operationId: replayStatusHandler
      description: Return the current state of the replay job.
      responses:
        '200':
          description: |-
            {
              success: true,
              data: {
                status: 'idle' | 'running' | 'complete' | 'error',
                from_ledger: number,
                to_ledger: number,
                ledgers_processed: number,
                ledgers_total: number,
                events_inserted: number,
                started_at: string | null,
                completed_at: string | null,
                error_message: string | null
              }
            }
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/feature-flags:
    get:
      tags:
        - admin
      summary: Returns all runtime feature flags and their current enabled state.
      operationId: getFeatureFlags
      description: |-
        Returns all runtime feature flags and their current enabled state.
        Cache is cleared before reading so the response always reflects DB state.
      responses:
        '200':
          description: '{ success: true, data: FeatureFlag[] }'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
    put:
      tags:
        - admin
      summary: Updates a feature flag without restarting the process.
      operationId: updateFeatureFlag
      description: |-
        Updates a feature flag without restarting the process.
        Writes a feature_flag_toggled audit entry on every change.
      requestBody:
        required: true
        description: '{ name: string, enabled: boolean }'
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                enabled:
                  type: boolean
              required:
                - name
                - enabled
              additionalProperties: false
      responses:
        '200':
          description: '{ success: true, data: FeatureFlag }'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/feature-flags/{name}:
    put:
      tags:
        - admin
      summary: Toggle a specific feature flag by name.
      operationId: toggleFeatureFlag
      description: |-
        Toggle a specific feature flag by name. Body only needs { enabled: boolean }.
        Returns 404 when the flag has not been seeded into the DB yet.
        Writes a feature_flag_toggled audit entry on every change.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: snake_case flag name
      requestBody:
        required: true
        description: '{ enabled: boolean }'
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required:
                - enabled
              additionalProperties: false
      responses:
        '200':
          description: '{ success: true, data: { name, enabled, updated_by, updated_at } }'
        '400':
          description: Invalid flag name or body
        '404':
          description: Flag not found
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/fees:
    get:
      tags:
        - admin
      summary: Returns a list of fee withdrawal events from the contract.
      operationId: getFeeSummary
      description: |-
        Returns a list of fee withdrawal events from the contract.
        Query params: startDate, endDate (ISO 8601)
      responses:
        '200':
          description: '{ success: true, data: FeeHistoryItem[] }'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
    post:
      tags:
        - admin
      summary: Withdraws accumulated platform fees from the Soroban contract to a specified recipient.
      operationId: withdrawFeesController
      description: Withdraws accumulated platform fees from the Soroban contract to a specified recipient.
      requestBody:
        required: true
        description: recipient {string} - Stellar public key of the withdrawal recipient
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient:
                  type: string
                  description: Additional validation is applied beyond this schema — see the route handler.
              required:
                - recipient
              additionalProperties: false
      responses:
        '200':
          description: '{ success: true, data: { transactionId, recipient, amount, token } }'
        '400':
          description: '{ success: false, error: string } - Invalid recipient address'
        '401':
          description: '{ success: false, error: string } - Missing token'
        '403':
          description: '{ success: false, error: string } - Non-admin role'
        '409':
          description: '{ success: false, error: string } - No fees available'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/fees/config:
    post:
      tags:
        - admin
      summary: Propose and execute an update_platform_fee multi-sig action.
      operationId: updatePlatformFeeController
      description: |-
        Propose and execute an update_platform_fee multi-sig action.
        Updates the on-chain platform fee in basis points (0–10000).
      requestBody:
        required: true
        description: newFeeBps {number} - New fee in basis points (0–10000)
        content:
          application/json:
            schema:
              type: object
              properties:
                actionId:
                  type: string
                  minLength: 1
                newFeeBps:
                  type: integer
                  minimum: 0
                  maximum: 10000
              required:
                - actionId
                - newFeeBps
      responses:
        '202':
          description: '{ success: true, data: { actionId, transactionId, newFeeBps } }'
        '400':
          description: '{ success: false, error: string }'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/fees/withdraw:
    post:
      tags:
        - admin
      summary: Withdraw accumulated platform fees from the Soroban contract to a treasury address.
      operationId: withdrawFeesV2Controller
      description: |-
        Withdraw accumulated platform fees from the Soroban contract to a treasury
        address. This is the fully-specified replacement for POST /api/admin/fees.
      requestBody:
        required: true
        description: |-
          amountStroops   {string|number} — positive integer ≤ contract fee balance

          Optional header: Idempotency-Key — prevents double-submission; cached result
          is returned on repeat requests with the same key (24-hour TTL).
        content:
          application/json:
            schema:
              type: object
              properties:
                treasuryAddress:
                  type: string
                  description: Additional validation is applied beyond this schema — see the route handler.
                amountStroops:
                  oneOf:
                    - type: string
                    - type: number
                  description: Additional validation is applied beyond this schema — see the route handler.
              required:
                - treasuryAddress
                - amountStroops
              additionalProperties: false
      responses:
        '200':
          description: >-
            { success: true, data: { transactionId, treasuryAddress, amountStroops, recipient,
            amount, token } }
        '202':
          description: >-
            { success: true, message, data: { actionId, collectedSignatures, requiredSignatures, … }
            }
                          — when ADMIN_THRESHOLD > 1 (multi-sig required)
        '400':
          description: '{ success: false, error } — invalid treasuryAddress or amountStroops'
        '401':
          description: '{ success: false, error } — missing/expired token'
        '403':
          description: '{ success: false, error } — non-admin role'
        '409':
          description: '{ success: false, error } — no fees / contract paused / concurrent withdrawal'
        '422':
          description: '{ success: false, error } — amountStroops exceeds contract fee balance'
        '503':
          description: '{ success: false, error } — transient network error (retryable)'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/indexer/reindex:
    post:
      tags:
        - admin
      summary: Reset the indexer's last_ledger so the next poll replays from fromLedger.
      operationId: reindex
      description: |-
        Resets the indexer's stored last_ledger to the given fromLedger value,
        causing the next poll cycle to replay all events from that ledger onward.
      requestBody:
        required: true
        description: fromLedger {number} - Ledger sequence number to replay from
        content:
          application/json:
            schema:
              type: object
              properties:
                fromLedger:
                  type: integer
                  minimum: 0
              required:
                - fromLedger
              additionalProperties: false
      responses:
        '200':
          description: '{ success: true, data: { fromLedger, previous } }'
        '400':
          description: '{ success: false, error: string } - Invalid fromLedger'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/introspect:
    post:
      tags:
        - admin
      summary: Decodes the caller's own bearer token and returns its payload metadata.
      operationId: introspectToken
      description: |-
        Decodes the caller's own bearer token and returns its payload metadata.
        The token is extracted from the Authorization header only — no body input is accepted.
        Useful for admins to inspect their own token claims (subject, role, expiry).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '200':
          description: '{ success: true, data: { sub, role, iat, exp } }'
        '401':
          description: '{ success: false, error: string } - Missing or invalid bearer token'
        '403':
          description: '{ success: false, error: string } - Non-admin role'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/ip-allowlist:
    post:
      tags:
        - admin
      summary: Manually set an IP's reputation score.
      operationId: setIpReputationController
      description: |-
        Manually set an IP's reputation score.
        - body { ip, score: 0 }   → whitelist the IP (score pinned at 0, immune to decay)
        - body { ip, score: 100 } → blacklist the IP (immediate 429 for all requests)
        - body { ip, score: N }   → any 0–100 value (admin override)
      requestBody:
        required: true
        description: '{ ip: string, score: number }'
        content:
          application/json:
            schema:
              type: object
              properties:
                ip:
                  type: string
                  minLength: 1
                score:
                  type: integer
                  minimum: 0
                  maximum: 100
              required:
                - ip
                - score
              additionalProperties: false
      responses:
        '200':
          description: '{ success: true, data: { ip, score } }'
        '400':
          description: '{ success: false, error: string } - Validation error'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/ip-reputation/{ip}:
    get:
      tags:
        - admin
      summary: Returns the current reputation record (score, lastSeen, pinned) for a given IP.
      operationId: getIpReputationController
      description: Returns the current reputation record (score, lastSeen, pinned) for a given IP.
      parameters:
