  /admin/reindex:
    post:
      tags:
        - admin
      summary: Trigger a background event backfill for a specific ledger range.
      operationId: triggerReindex
      description: |-
        Trigger a background event backfill for a specific ledger range.
        The job fetches events in batches of 100 ledgers with a 50 ms inter-batch
        delay. Duplicate events are silently discarded via the UNIQUE constraint on
        tx_hash. The job status is available via GET /api/admin/reindex/status.

        Timeout: disabled (0). The endpoint returns 202 immediately — the actual
        backfill runs as a background job and must never be killed by a network timeout.
      requestBody:
        required: true
        description: '{ fromLedger: number, toLedger: number }'
        content:
          application/json:
            schema:
              type: object
              properties:
                fromLedger:
                  type: integer
                  minimum: 0
                toLedger:
                  type: integer
                  minimum: 1
              required:
                - fromLedger
                - toLedger
              additionalProperties: false
      responses:
        '202':
          description: '{ success: true, data: { fromLedger, toLedger, status: ''running'' } }'
        '409':
          description: '{ success: false, error: string } - job already running'
        '422':
          description: '{ success: false, error: string } - range > 10 000 ledgers or invalid range'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
  /admin/reindex/cancel:
    post:
      tags:
        - admin
      summary: Cooperatively cancel a running background reindex job.
      operationId: cancelReindexHandler
      description: |-
        Cooperatively cancel a running background reindex job. Sets a cancel flag
        that the batch loop checks after each batch; the job transitions to
        'cancelled' within one batch iteration and persists the last-processed ledger.

        Returns 409 when no job is currently running.

        NOTE: process-local flag only — multi-instance support requires a shared
        flag (e.g. Redis) and is tracked as a follow-up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '200':
          description: '{ success: true, data: { status: ''cancel_requested'', message } }'
        '409':
          description: '{ success: false, error: string } - no job running'
      security:
        - bearerAuth: []
      x-required-role:
        - admin
