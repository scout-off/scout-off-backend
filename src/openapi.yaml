        '201':
          description: '{ success: true, data: { transactionId, tier, expiresAt, status } } - New subscription'
        '400':
          description: '{ success: false, error: string } - Invalid tier or duration'
        '402':
          description: '{ success: false, error: string } - Insufficient XLM balance'
        '403':
          description: '{ success: false, error: string } - Scout role required or wallet mismatch'
