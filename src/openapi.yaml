      operationId: testWebhook
      description: |-
        Send a test ping to the registered URL, signed with the subscription secret.
        Returns 502 when the remote server does not respond with 2xx or is unreachable.

        Rate limited separately from — and more tightly than — other scout write
        endpoints (#1037), since each call makes the backend issue an outbound
        HTTP request to a caller-supplied URL. Default: 5 requests/minute per
        wallet (WEBHOOK_TEST_RATE_LIMIT_MAX / WEBHOOK_TEST_RATE_LIMIT_WINDOW_MS).
        Exceeding it returns 429 before any outbound request is attempted.
      parameters:
        - name: wallet
          in: path
          required: true
          schema:
            type: string
          description: Scout's Stellar public key
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Webhook subscription row ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '200':
          description: '{ success: true, data: { id, url, statusCode } }'
        '400':
          description: '{ success: false, error: string } - Invalid subscription id'
        '403':
          description: >-
            { success: false, error: string } - Wallet mismatch or subscription belongs to another
            scout
        '404':
          description: '{ success: false, error: string } - Subscription not found'
        '429':
          description: '{ success: false, error: string } - Webhook-test rate limit exceeded'
        '502':
          description: >-
