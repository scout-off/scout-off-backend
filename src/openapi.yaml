  /scouts/{wallet}/contacts/{playerId}/unlock:
    post:
      tags:
        - scouts
      summary: Pay the XLM micro-fee to unlock a player's contact details.
      operationId: unlockContact
      description: |-
        Pay-to-contact XLM micro-fee flow (#761): the idempotency middleware is
        configured with a request fingerprint (wallet + playerId) so replaying the
        same Idempotency-Key with a materially different request is rejected with
        409 instead of reusing the cached response, and duplicate requests with the
        same key never submit a second blockchain transaction. Already-unlocked
        players are returned without a second charge (`alreadyUnlocked: true`).
      parameters:
        - name: wallet
          in: path
          required: true
          schema:
            type: string
          description: Scout's Stellar public key
        - name: playerId
          in: path
          required: true
          schema:
            type: string
          description: Player's unique identifier (cuid2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '200':
          description: >-
            { success: true, data: { alreadyUnlocked?: true, transactionId?, status?,
            ...ContactDetails } }
        '400':
          description: >-
            { success: false, error: string } - Missing params or scout trying to unlock their own
            profile
        '401':
          description: '{ success: false, error: string } - Wallet mismatch or missing token'
        '402':
          description: '{ success: false, error: string, code } - Payment failed (see PaymentError code)'
        '404':
          description: '{ success: false, error: string } - Player not found'
        '409':
          description: '{ success: false, error: string } - Idempotency key reused with a different request'
      security:
        - bearerAuth: []
        - apiKeyAuth:
            - write:contacts
      x-required-role:
        - scout
      x-api-key-scope: write:contacts
      x-owner-only: true
