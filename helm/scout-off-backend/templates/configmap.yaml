apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "scout-off-backend.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scout-off-backend.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{- /* An empty value means "use the application default": leave the key out
         so config.ts applies its own default instead of receiving "". */}}
  {{- if ne (toString $value) "" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
