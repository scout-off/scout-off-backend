[workspace]
resolver = "2"
members = [
    "shared",
    "register",
    "progress",
    "subscription",
    "connection",
]

[workspace.dependencies]
soroban-sdk = { version = "27.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
