services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        VERSION: ${VERSION:-1.0.0}
        BUILD_DATE: ${BUILD_DATE:-}
    image: scout-off-backend:local
    container_name: scout-off-backend
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      # Named volume keeps the SQLite DB file across restarts and `docker compose down`
      - scout_db:/data
    environment:
      NODE_ENV: development

      # ── Server ────────────────────────────────────────────────────
      PORT: "4000"

      # ── Auth (REQUIRED — change before first run) ─────────────────
      # Generate a strong secret: openssl rand -hex 32
      JWT_SECRET: "change-me-to-a-long-random-secret-at-least-32-chars"
      ADMIN_WALLET: ""

      # ── Stellar / Soroban ─────────────────────────────────────────
      # Points at the `stellar` service below: a standalone Stellar network
      # running inside this compose project, so the stack works with no
      # hosted testnet RPC and no internet access.
      #
      # These four are deliberately literal rather than ${VAR:-default}
      # interpolations. A root .env file — the normal setup for running the
      # backend outside Docker — points NETWORK/HORIZON_URL/SOROBAN_RPC_URL at
      # testnet, and compose interpolation would silently pull those values in
      # and redirect this stack off the local chain (and, if the URLs used
      # localhost, make them unreachable from inside the container).
      #
      # To target a hosted network instead, replace all four together — the
      # passphrase must match the network. For testnet:
      #   NETWORK: testnet
      #   NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      #   HORIZON_URL: "https://horizon-testnet.stellar.org"
      #   SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
      NETWORK: standalone
      NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
      HORIZON_URL: "http://stellar:8000"
      SOROBAN_RPC_URL: "http://stellar:8000/soroban/rpc"

      # CONTRACT_ID is required by the app — run
      # ./scripts/soroban-sandbox/deploy.sh against the local network to build,
      # deploy and initialize the contracts, then use the printed register
      # contract ID here (the script also writes every per-contract ID to
      # scripts/soroban-sandbox/.env.contracts). The placeholder below satisfies
      # the startup check; the indexer will log errors on each poll until a real
      # contract ID is supplied.
      CONTRACT_ID: "PLACEHOLDER_REPLACE_WITH_REAL_CONTRACT_ID"

      # ── Database ──────────────────────────────────────────────────
      # Mapped to the named volume mount point set in the Dockerfile
      DB_PATH: /data/scout-off.db

      # ── IPFS / Pinata (optional in development) ───────────────────
      PINATA_API_KEY: ""
      PINATA_SECRET: ""
      PINATA_GATEWAY: "https://gateway.pinata.cloud"

      # ── Platform ──────────────────────────────────────────────────
      PLATFORM_FEE_BPS: "500"
      LOG_LEVEL: info

      # ── Feature flags ─────────────────────────────────────────────
      # Disable Stellar health check so the server starts cleanly
      # even when CONTRACT_ID is not yet set
      STELLAR_HEALTH_CHECK: "false"
      JSON_PAYLOAD_LIMIT: 1mb
      UPLOAD_PAYLOAD_LIMIT: 10mb

      # ── Rate limiting ─────────────────────────────────────────────
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "60"

      # ── Webhooks (off by default) ─────────────────────────────────
      WEBHOOK_ENABLED: "false"
      WEBHOOK_URL: ""

      # ── Security headers ──────────────────────────────────────────
      SECURITY_HSTS: "max-age=31536000; includeSubDomains"
      SECURITY_X_CONTENT_TYPE_OPTIONS: nosniff
      SECURITY_X_FRAME_OPTIONS: DENY
      SECURITY_REFERRER_POLICY: no-referrer

      # ── API versioning ────────────────────────────────────────────
      API_PREFIX: /api
      API_V: v1

      # ── Metrics ───────────────────────────────────────────────────
      METRICS_ENABLED: "false"

      # ── Milestone rate limiting ───────────────────────────────────
      MILESTONE_RATE_WINDOW_MS: "60000"
      MILESTONE_RATE_MAX: "10"

      # ── Redis (optional) ──────────────────────────────────────────
      # Points the search cache (src/services/cache.ts) at the redis service
      # below instead of the process-local in-memory fallback. Unset this
      # (or remove the redis service and depends_on) to run against the
      # in-memory cache — nothing else needs to change.
      REDIS_URL: "redis://redis:6379"

      # ── Proxy ─────────────────────────────────────────────────────
      TRUSTED_PROXY_COUNT: "0"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - redis
      - stellar

  # Optional: only needed so `backend` can use the Redis-backed cache store
  # locally. The backend falls back to an in-memory cache automatically if
  # REDIS_URL is unset, so this service can be removed (along with the
  # depends_on above) without breaking anything.
  # Pinned to match the version CI and production use (see .github/workflows/ci.yml).
  # Bump procedure: update this tag, ci.yml's redis service tag, and the
  # production Redis version together, then re-run the test suite.
  redis:
    image: redis:7.4-alpine
    container_name: scout-off-redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local Stellar network (stellar/quickstart) — the chain `backend` talks to
  # by default, so on-chain flows can be developed without a hosted testnet RPC
  # and without testnet resets invalidating a local environment.
  #
  # Runs in local network mode: standalone chain, network passphrase
  # "Standalone Network ; February 2017", Soroban RPC on :8000/soroban/rpc,
  # Horizon and the friendbot faucet on :8000. Data is ephemeral — quickstart
  # only persists when a volume is mounted at /opt/stellar, and persistent mode
  # asks for a Postgres password on stdin on first start, which does not work
  # in a non-interactive `docker compose up`. Re-running `docker compose up`
  # therefore starts from a fresh chain, so re-run
  # ./scripts/soroban-sandbox/deploy.sh and refresh CONTRACT_ID afterwards.
  #
  # Deploy the contracts onto it with ./scripts/soroban-sandbox/deploy.sh; the
  # full walkthrough is in docs/soroban-sandbox-e2e.md.
  #
  # Start without it (e.g. against testnet): `docker compose up backend redis`
  # — the backend starts either way (STELLAR_HEALTH_CHECK is off below) and
  # simply retries its RPC calls until the network is reachable.
  stellar:
    # Not pinned: quickstart's tags track upstream releases and the same
    # `latest` tag is used by scripts/soroban-sandbox/docker-compose.yml and the
    # nightly Soroban E2E workflow, so both stay in step.
    image: stellar/quickstart:latest
    container_name: scout-off-stellar
    # The image is published for linux/amd64 only; on arm64 hosts (Apple
    # silicon) Docker Desktop runs it through emulation.
    platform: linux/amd64
    restart: unless-stopped
    # --local selects the standalone network; --enable-soroban-rpc turns on the
    # RPC server (and, in local mode, Horizon + friendbot with it).
    command: --local --enable-soroban-rpc
    ports:
      # Host port only — containers reach the network at stellar:8000.
      - "${STELLAR_PORT:-8000}:8000"
    healthcheck:
      # /soroban/rpc is a JSON-RPC endpoint: it must be POSTed. A plain GET
      # returns 405, so a `curl -f` probe would keep the container permanently
      # unhealthy. This is the same request scripts/soroban-sandbox/wait-for-rpc.sh
      # polls for before deploying.
      test:
        - CMD-SHELL
        - >-
          curl -sf -X POST http://localhost:8000/soroban/rpc
          -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # PostgreSQL service (optional, for testing the PostgreSQL driver).
  # To use PostgreSQL instead of SQLite:
  # 1. docker-compose up -d postgres
  # 2. Set DATABASE_URL and DB_DRIVER environment variables in the backend service
  # Pinned to match the version CI and production use (see .github/workflows/ci.yml).
  # Bump procedure: update this tag, ci.yml's postgres service tag, and the
  # production PostgreSQL version together, then re-run the test suite.
  postgres:
    image: postgres:16.4-alpine
    container_name: scout-off-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scout_user
      POSTGRES_PASSWORD: scout_password
      POSTGRES_DB: scout_off
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout_user -d scout_off"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # Named volume — survives `docker compose down` (data is only lost on `down -v`)
  scout_db:
  # PostgreSQL data volume
  postgres_data:
